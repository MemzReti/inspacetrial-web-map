<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universe Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="map"></canvas>

    <div id="ui">
      <div id="topBar">
        <div id="brand">
          <span id="brandMark">◈</span>
          <span id="brandText">UNIVERSE&nbsp;MAP</span>
        </div>
        <div id="coordStack">
          <div id="coords1" class="coordLine">[—, —]</div>
          <div id="coords2" class="coordLine coordLineMuted">SYS —</div>
        </div>
      </div>

      <button id="backBtn">‹ Back</button>

      <div id="infoPanel">
        <div id="infoPanelHeader">
          <span class="infoDot"></span>
          <span>OBJECT&nbsp;SCAN</span>
        </div>
        <div id="info">Right-click a system or body to inspect it.</div>
      </div>

      <button id="teleportBtn">Teleport ›</button>

      <div id="hint">
        Cluster: 100 systems · System: bodies · WASD: move · Left drag: pan · Scroll: zoom · Left click: open · Middle click: select · Right click: inspect
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
